<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stream Player</title>
  
  <!-- External CSS Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

  <style>
    :root {
      --brand-blue: #4169E1;
      --brand-blue-glow: rgba(65, 105, 225, 0.6);
      --bg-dark: #0a0a0c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* ── SCREENS ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: radial-gradient(circle at center, #0f1712 0%, var(--bg-dark) 100%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
      text-align: center;
    }
    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── LOADER SCREEN ── */
    #loader-screen { z-index: 50; }

    /* Centered Glowing Brand Title with pulsing animation */
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      letter-spacing: 4px;
      line-height: 1;
      text-align: center;
      color: #ffffff;
      animation: brandGlow 2s ease-in-out infinite alternate;
    }
    .brand-title span { color: var(--brand-blue); }

    @keyframes brandGlow {
      0% {
        text-shadow: 0 0 10px rgba(65, 105, 225, 0.4), 0 0 20px rgba(65, 105, 225, 0.2);
        transform: scale(0.98);
      }
      100% {
        text-shadow: 0 0 25px rgba(65, 105, 225, 0.9), 0 0 45px rgba(65, 105, 225, 0.6);
        transform: scale(1.02);
      }
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 16px;
      font-weight: 600;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Preserved ... Dots Loading Animation */
    .connecting-dots {
      display: inline-flex;
      gap: 4px;
    }
    .dot {
      width: 4px;
      height: 4px;
      background-color: var(--brand-blue);
      border-radius: 50%;
      display: inline-block;
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── PLAYER & WATERMARKS ── */
    #player-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      z-index: 5;
    }
    video { width: 100%; height: 100%; display: block; }
    .plyr { width: 100% !important; height: 100% !important; position: relative; font-weight: 600; }
    .plyr--video, .plyr__video-wrapper { height: 100% !important; }
    .plyr video { height: 100% !important; object-fit: contain; }
    
    /* Watermark Top Left (Join) */
    #join-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 102;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 3px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      transition: all 0.4s ease;
      opacity: 0;
      visibility: hidden;
    }
    #join-btn.visible { opacity: 1; visibility: visible; }
    #join-btn:hover { color: #fff; border-color: #fff; background: rgba(0,0,0,0.7); }

    /* Custom Overlay Fullscreen Button */
    #custom-fs-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 103;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(65, 105, 225, 0.3);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s ease, transform 0.2s;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
    }
    #custom-fs-btn.visible { opacity: 1; visibility: visible; }
    #custom-fs-btn:hover {
      background: rgba(65, 105, 225, 0.2);
      border-color: var(--brand-blue);
      box-shadow: 0 0 8px var(--brand-blue-glow);
      transform: scale(1.05);
    }
    #custom-fs-btn svg { width: 14px; height: 14px; fill: currentColor; }

    .plyr--hide-controls #join-btn,
    .plyr--hide-controls #custom-fs-btn {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* Watermark Bottom Center */
    #wm {
      position: absolute;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 102;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      width: max-content;
      max-width: 90%;
    }
    #wm.visible {
      visibility: visible;
      opacity: 0.4;
    }
    .plyr--hide-controls #wm.visible { opacity: 0.2; }
    .wm-rule { width: 30px; height: 1px; background: linear-gradient(90deg, transparent, var(--brand-blue)); flex-shrink: 0; }
    .wm-rule.r { background: linear-gradient(90deg, var(--brand-blue), transparent); flex-shrink: 0; }
    .wm-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; white-space: nowrap; }
    .wm-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 4px; color: #fff; text-shadow: 0 2px 10px #000; }
    .wm-name span { color: var(--brand-blue); }
    .wm-url { font-size: 10px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.6); text-transform: uppercase; white-space: nowrap; }

    /* In-Player Buffering Spinner */
    #buffering-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 101;
      display: flex;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #buffering-indicator.active {
      opacity: 1;
      visibility: visible;
    }

    /* Error Screen Styles */
    .error-icon {
      width: 48px;
      height: 48px;
      color: #ff4757;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .error-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      max-width: 280px;
      line-height: 1.4;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOADER SCREEN -->
  <div id="loader-screen" class="screen">
    <div class="brand-title">STREAM <span>47</span></div>
    <div class="subtitle">
      <span id="status-text">CONNECTING</span>
      <div class="connecting-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- ERROR SCREEN -->
  <div id="error-screen" class="screen hidden">
    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <div class="error-title">STREAM OFFLINE</div>
    <div id="error-desc" class="error-desc">Unable to load the requested video stream. Please check your link or try again later.</div>
  </div>

  <!-- PLAYER WRAPPER -->
  <div id="player-wrap">
    <a id="join-btn" href="https://whatsapp.com/channel/0029VbBcvbn9WtC1onDirp09" target="_blank">JOIN US</a>
    
    <!-- In-Player Buffering Indicator -->
    <div id="buffering-indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- CUSTOM FULLSCREEN BUTTON -->
    <button id="custom-fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
      <svg viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>

    <!-- WATERMARK BOTTOM CENTER -->
    <div id="wm">
      <div class="wm-rule"></div>
      <div class="wm-inner">
        <div class="wm-name">STREAM <span>47</span></div>
        <div class="wm-url">STREAM47.BLOGSPOT.COM</div>
      </div>
      <div class="wm-rule r"></div>
    </div>

    <video id="player" playsinline crossorigin="anonymous"></video>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let hls = null;
      let plyr = null;
      let hardTimeout = null;
      let retryCount = 0;
      let wmTimer = null;
      const MAX_RETRIES = 3;

      const params = new URLSearchParams(window.location.search);
      const DIRECT_SRC = params.get('url') || params.get('stream') || params.get('get') || params.get('src') || '';

      const video = document.getElementById('player');
      const loaderScreen = document.getElementById('loader-screen');
      const errorScreen = document.getElementById('error-screen');
      const statusText = document.getElementById('status-text');
      const wm = document.getElementById('wm');
      const joinBtn = document.getElementById('join-btn');
      const customFsBtn = document.getElementById('custom-fs-btn');
      const bufferingIndicator = document.getElementById('buffering-indicator');

      // Robust Fullscreen Switch
      window.toggleFullscreen = function() {
        if (!plyr) return;
        if (plyr.fullscreen.active) {
          plyr.fullscreen.exit();
        } else {
          plyr.fullscreen.enter();
        }
      };

      function lockLandscape() {
        try {
          const scr = screen.orientation || screen.msOrientation;
          if (scr && scr.lock) scr.lock('landscape').catch(() => {});
        } catch(e) {}
      }

      function unlockOrientation(){
        try {
          const scr = screen.orientation || screen.msOrientation;
          if (scr && scr.unlock) scr.unlock();
        } catch(e) {}
      }
      document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) lockLandscape(); else unlockOrientation(); });
      video.addEventListener('webkitbeginfullscreen', lockLandscape);
      video.addEventListener('webkitendfullscreen', unlockOrientation);

      function triggerError(msg) {
        clearTimeout(hardTimeout);
        loaderScreen.classList.add('hidden');
        errorScreen.classList.remove('hidden');
        bufferingIndicator.classList.remove('active');
        if (msg) document.getElementById('error-desc').textContent = msg;
        if (hls) { hls.destroy(); hls = null; }
        if (plyr) { plyr.destroy(); plyr = null; }
      }

      function mountWm(){
        const p = document.querySelector('.plyr');
        if (p && !p.contains(wm)) { p.style.position = 'relative'; p.appendChild(wm); }
      }

      function onVideoReadyToPlay() {
        clearTimeout(hardTimeout);
        loaderScreen.classList.add('hidden');
        errorScreen.classList.add('hidden');
        bufferingIndicator.classList.remove('active');
        mountWm();
        
        // Reveal overlays ONLY when video is actually playing/ready
        wm.classList.add('visible');
        joinBtn.classList.add('visible');
        customFsBtn.classList.add('visible');
      }

      if (!DIRECT_SRC) {
        triggerError('No stream URL provided. Add ?url=<m3u8-link> to the page URL.');
        return;
      }

      // Handle Player Buffering State for embedded views
      video.addEventListener('waiting', () => {
        if (loaderScreen.classList.contains('hidden')) {
          bufferingIndicator.classList.add('active');
        }
      });

      // Hide Loader as soon as video plays OR is ready to be played
      video.addEventListener('playing', onVideoReadyToPlay);
      video.addEventListener('canplay', onVideoReadyToPlay);
      video.addEventListener('loadedmetadata', onVideoReadyToPlay);

      // Core Player Setup
      function initPlayer(src) {
        clearTimeout(hardTimeout);
        hardTimeout = setTimeout(() => {
          if (!video.readyState) triggerError('Connection timed out. Stream server took too long to respond.');
        }, 20000);

        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90
          });

          hls.loadSource(src);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            initPlyr();
            video.play().catch(() => {
              // Autoplay blocked by browser; ready state handler will show play controls
            });
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    statusText.textContent = `RETRYING (${retryCount}/${MAX_RETRIES})`;
                    hls.startLoad();
                  } else {
                    triggerError('Network error encountered. Could not load the stream source.');
                  }
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  hls.recoverMediaError();
                  break;
                default:
                  triggerError('Fatal stream error occurred. Unable to play video.');
                  break;
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = src;
          initPlyr();
          video.play().catch(() => {});
        } else {
          triggerError('Your browser does not support HLS stream playback.');
        }
      }

      function initPlyr() {
        if (plyr) return;
        plyr = new Plyr(video, {
          controls: ['play-large', 'play', 'mute', 'volume', 'pip', 'airplay'],
          fullscreen: { enabled: true, fallback: true, iosNative: true },
          keyboard: { focused: true, global: true }
        });
      }

      // Watermark fading logic
      function resetWm() {
        if (!wm.classList.contains('visible')) return;
        wm.style.opacity = '0.4';
        clearTimeout(wmTimer);
        wmTimer = setTimeout(() => { if (!video.paused && wm.classList.contains('visible')) wm.style.opacity = '0.2'; }, 3000);
      }
      video.addEventListener('play', resetWm);
      video.addEventListener('pause', () => {
        if (wm.classList.contains('visible')) wm.style.opacity = '0.4';
      });
      document.addEventListener('mousemove', resetWm);
      document.addEventListener('touchstart', resetWm);

      // Start Initialization
      initPlayer(DIRECT_SRC);
    });
  </script>
</body>
</html>
