<!DOCTYPE html>
<html lang="en">
  <head>
    <title>47 LIVE</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="description" content="Live match stream player" />
    <meta name="author" content="SportsTrack" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Dependencies -->
    <link rel="preconnect" href="https://cdn.plyr.io" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    
    <!-- Google IMA SDK for VAST Ads -->
<script src="//imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Keyboard/Right-click Protection -->
    <script>
      document.addEventListener("contextmenu", e => e.preventDefault(), false);
      document.addEventListener("keydown", e => {
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) e.preventDefault();
        if (e.ctrlKey && e.keyCode === 85) e.preventDefault();
        if (e.keyCode === 123) e.preventDefault();
      }, false);
    </script>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --brand-blue: #4d7cff;
        --brand-blue-glow: rgba(77, 124, 255, 0.6);
        --bg-dark: #07090e;
        --text-dim: #9ca3af;
        --plyr-color-main: #4d7cff;
      }

      html, body {
        width: 100%;
        height: 100%;
        background-color: var(--bg-dark);
        overflow: hidden;
        font-family: 'Rajdhani', sans-serif;
        color: #fff;
      }

      /* ── BACKGROUND GRID ── */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 30px 30px;
        z-index: 0;
        pointer-events: none;
        transform: perspective(500px) rotateX(45deg) scale(2);
        transform-origin: top center;
        opacity: 0.35;
      }

      /* ── SCREENS ── */
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        background: radial-gradient(circle at center, #0c1017 0%, var(--bg-dark) 100%);
        transition: opacity 0.5s ease, visibility 0.5s ease;
        padding: 10px;
      }
      .screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── LOADER SCREEN ── */
      #loader-screen { z-index: 50; }
      
      .brand-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(32px, 6vw, 48px);
        letter-spacing: clamp(3px, 0.8vw, 5px);
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.35), 0 0 35px rgba(77, 124, 255, 0.25);
        margin-bottom: clamp(10px, 2vh, 16px);
      }
      .brand-title span { 
        color: #3b82f6; 
        text-shadow: 0 0 20px rgba(59, 130, 246, 0.6), 0 0 40px rgba(59, 130, 246, 0.3);
      }

      .dots-container {
        display: flex;
        gap: clamp(6px, 1.2vw, 10px);
        margin-bottom: clamp(16px, 3vh, 28px);
      }
      .dot {
        width: clamp(6px, 1vw, 8px);
        height: clamp(6px, 1vw, 8px);
        background-color: #3b82f6;
        border-radius: 50%;
        opacity: 0.3;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        animation: pulseDot 1.4s infinite ease-in-out both;
      }
      .dot:nth-child(1) { animation-delay: -0.32s; }
      .dot:nth-child(2) { animation-delay: -0.16s; }
      @keyframes pulseDot {
        0%, 80%, 100% { transform: scale(0.75); opacity: 0.25; }
        40% { transform: scale(1.15); opacity: 0.9; }
      }

      .subtitle {
        font-size: clamp(10px, 1.8vw, 13px);
        font-weight: 600;
        letter-spacing: clamp(4px, 1.2vw, 8px);
        color: #8b9bb4;
        text-transform: uppercase;
        margin-bottom: clamp(16px, 3vh, 28px);
        padding-left: clamp(4px, 1.2vw, 8px);
      }

      .status-text {
        font-size: clamp(9px, 1.5vw, 11px);
        font-weight: 600;
        letter-spacing: clamp(3px, 1vw, 5px);
        color: #6b7c96;
        text-transform: uppercase;
        padding-left: clamp(3px, 1vw, 5px);
      }

      /* ── ERROR SCREEN ── */
      #error-screen {
        z-index: 60;
        background: var(--bg-dark);
      }
      
      .lightning-icon {
        width: clamp(32px, 5vw, 42px);
        height: clamp(32px, 5vw, 42px);
        fill: #dca952;
        margin-bottom: 16px;
        filter: drop-shadow(0 0 12px rgba(220, 169, 82, 0.3));
      }

      .error-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(24px, 4vw, 32px);
        letter-spacing: 2px;
        margin-bottom: 12px;
      }

      .error-desc {
        font-family: 'Courier New', Courier, monospace;
        font-size: clamp(10px, 1.5vw, 12px);
        color: var(--text-dim);
        text-align: center;
        max-width: 280px;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      .retry-btn {
        background-color: var(--brand-blue);
        color: #fff;
        border: none;
        padding: 8px 24px;
        border-radius: 4px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(65, 105, 225, 0.2);
      }
      .retry-btn:hover {
        transform: translateY(-2px);
        background-color: #5c85ff;
        box-shadow: 0 6px 20px rgba(65, 105, 225, 0.35);
      }

      /* ── PLAYER & WATERMARKS ── */
      #player-wrap {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
        z-index: 5;
      }
      video { width: 100%; height: 100%; display: block; }
      .plyr { width: 100% !important; height: 100% !important; position: relative; font-weight: 600; }
      .plyr--video, .plyr__video-wrapper { height: 100% !important; }
      .plyr video { height: 100% !important; object-fit: contain; }
      
      /* Watermark Top Left (Join) */
      #join-btn {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 102;
        color: rgba(255,255,255,0.7);
        border: 1px solid rgba(255,255,255,0.3);
        padding: 2px 8px;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 1px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
        transition: all 0.2s;
      }
      #join-btn:hover { color: #fff; border-color: #fff; background: rgba(0,0,0,0.7); }

      /* Custom Overlay Fullscreen Button */
      #custom-fs-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 103;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(65, 105, 225, 0.3);
        color: #fff;
        width: 26px;
        height: 26px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease, opacity 0.3s ease;
        backdrop-filter: blur(4px);
      }
      #custom-fs-btn:hover {
        background: rgba(65, 105, 225, 0.2);
        border-color: var(--brand-blue);
        box-shadow: 0 0 8px var(--brand-blue-glow);
        transform: scale(1.05);
      }
      #custom-fs-btn svg {
        width: 12px;
        height: 12px;
        stroke: #fff;
        transition: transform 0.2s;
      }
      #custom-fs-btn:active svg {
        transform: scale(0.9);
      }
      .plyr--hide-controls #custom-fs-btn {
        opacity: 0;
        pointer-events: none;
      }

      /* Watermark Bottom Center - Default hidden until stream loads */
      #wm {
        position: absolute;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 102;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #wm.visible {
        opacity: 0.4;
        visibility: visible;
      }
      .plyr--hide-controls #wm.visible { opacity: 0.2; }
      .wm-rule { width: 22px; height: 1px; background: linear-gradient(90deg, transparent, var(--brand-blue)); }
      .wm-rule.r { background: linear-gradient(90deg, var(--brand-blue), transparent); }
      .wm-inner { display: flex; flex-direction: column; align-items: center; gap: 1px; }
      .wm-name { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 8px #000; }
      .wm-name span { color: var(--brand-blue); }
      .wm-url { font-size: 8px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.6); text-transform: uppercase; }

      /* Hidden helper utility class */
      .hidden { display: none !important; }
      
      /* ── VAST AD CONTAINER ── */
#ad-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 100; /* Higher than #loader-screen (50) */
  pointer-events: auto; /* Allows users to click the ad/skip button */
}
      
    </style>
  </head>
  <body>

    <!-- BACKGROUND GRID -->
    <div class="bg-grid"></div>

    <!-- LOADER SCREEN (Redesigned to match image) -->
    <div id="loader-screen" class="screen">
      <h1 class="brand-title">SPORTS<span>TRACK</span></h1>
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <h2 class="subtitle">LIVE MATCH CENTER</h2>
      <p class="status-text" id="status-text">ESTABLISHING CONNECTION...</p>
    </div>

    <!-- ERROR SCREEN -->
    <div id="error-screen" class="screen hidden">
      <svg class="lightning-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="#dca952" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <h1 class="error-title">STREAM UNAVAILABLE</h1>
      <p class="error-desc" id="error-desc">Player did not load. Check if the stream URL is valid, CORS is allowed, and the .m3u8 is reachable.</p>
      <button class="retry-btn" onclick="location.reload()">RETRY</button>
    </div>

    <!-- PLAYER WRAPPER -->
    <div id="player-wrap">
      <a id="join-btn" href="https://www.whatsapp.com/channel/0029Vb7Jqva5K3zLauUJSv2s" target="_blank">JOIN US</a>
      
      <!-- AD CONTAINER FOR VAST -->
  <div id="ad-container"></div>
      
      <!-- CUSTOM FULLSCREEN BUTTON -->
      <button id="custom-fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        <svg class="fs-icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <svg class="fs-icon-exit hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"/>
        </svg>
      </button>
      
      <video id="player" controls playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
    </div>

    <!-- WATERMARK -->
    <div id="wm">
      <div class="wm-rule"></div>
      <div class="wm-inner">
        <div class="wm-name">SPORTS<span>TRACK</span></div>
        <div class="wm-url">sportstrack.me</div>
      </div>
      <div class="wm-rule r"></div>
    </div>

    <script>
      (function(){
        let hls = null;
        let plyr = null;
        let hardTimeout = null;
        let retryCount = 0;
        let wmTimer = null;
        const MAX_RETRIES = 3;

        const params = new URLSearchParams(window.location.search);
        const DIRECT_SRC = params.get('url') || params.get('stream') || params.get('get') || params.get('src') || '';

        const video = document.getElementById('player');
        const loaderScreen = document.getElementById('loader-screen');
        const errorScreen = document.getElementById('error-screen');
        const statusText = document.getElementById('status-text');
        const wm = document.getElementById('wm');
        const customFsBtn = document.getElementById('custom-fs-btn');
        
        let adsLoader, adsManager, adDisplayContainer;
    let adInitialized = false;
    const VAST_TAG_URL = "https://youradexchange.com/video/select.php?r=12342954";

    function initIMA() {
      if (adInitialized) return;
      adInitialized = true;

      // 1. Create Ad Display Container
      adDisplayContainer = new google.ima.AdDisplayContainer(
        document.getElementById('ad-container'),
        video
      );

      // 2. Create AdsLoader
      adsLoader = new google.ima.AdsLoader(adDisplayContainer);

      // 3. Listeners
      adsLoader.addEventListener(
        google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
        onAdsManagerLoaded,
        false
      );
      adsLoader.addEventListener(
        google.ima.AdsErrorEvent.Type.ADS_ERROR,
        onAdError,
        false
      );

      // Initialize container on user interaction (Required by browser autoplay policies)
      const triggerAdPlayback = () => {
        adDisplayContainer.initialize();
        requestAds();
        video.removeEventListener('play', triggerAdPlayback);
      };
      
      video.addEventListener('play', triggerAdPlayback);
    }

    function requestAds() {
      const adsRequest = new google.ima.AdsRequest();
      adsRequest.adTagUrl = VAST_TAG_URL;
      adsRequest.linearAdSlotWidth = video.clientWidth;
      adsRequest.linearAdSlotHeight = video.clientHeight;
      adsRequest.nonLinearAdSlotWidth = video.clientWidth;
      adsRequest.nonLinearAdSlotHeight = video.clientHeight;

      try {
        adsLoader.requestAds(adsRequest);
      } catch (e) {
        console.error("Error requesting ads:", e);
      }
    }

    function onAdsManagerLoaded(ismaticEvent) {
      const adsRenderingSettings = new google.ima.AdsRenderingSettings();
      adsRenderingSettings.restoreCustomPlaybackState = true;
      
      adsManager = ismaticEvent.getAdsManager(video, adsRenderingSettings);

      adsManager.addEventListener(google.ima.AdErrorEvent.Type.ADS_ERROR, onAdError);
      adsManager.addEventListener(google.ima.AdsEventType.CONTENT_PAUSE_REQUESTED, () => {
        video.pause();
      });
      adsManager.addEventListener(google.ima.AdsEventType.CONTENT_RESUME_REQUESTED, () => {
        video.play().catch(()=>{});
      });

      try {
        adsManager.init(video.clientWidth, video.clientHeight, google.ima.ViewMode.NORMAL);
        adsManager.start();
      } catch (adError) {
        onAdError(adError);
      }
    }

    function onAdError(adErrorEvent) {
      console.warn('Ad error encountered, resuming stream content:', adErrorEvent.getError ? adErrorEvent.getError() : adErrorEvent);
      if (adsManager) adsManager.destroy();
      video.play().catch(()=>{});
    }

    // Call initIMA right after setting up your player initialization
    initIMA();

        // Robust Fullscreen Switch
        window.toggleFullscreen = function() {
          const wrapper = document.getElementById('player-wrap');
          const isFS = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;

          if (!isFS) {
            if (wrapper.requestFullscreen) {
              wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
              wrapper.webkitRequestFullscreen();
            } else if (wrapper.mozRequestFullScreen) {
              wrapper.mozRequestFullScreen();
            } else if (wrapper.msRequestFullscreen) {
              wrapper.msRequestFullscreen();
            } else if (video.webkitEnterFullscreen) {
              video.webkitEnterFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
              document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
              document.msExitFullscreen();
            }
          }
        };

        function updateFullscreenIcons() {
          const enterIcon = customFsBtn.querySelector('.fs-icon-enter');
          const exitIcon = customFsBtn.querySelector('.fs-icon-exit');
          const isFS = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;

          if (isFS) {
            enterIcon.classList.add('hidden');
            exitIcon.classList.remove('hidden');
          } else {
            enterIcon.classList.remove('hidden');
            exitIcon.classList.add('hidden');
          }
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcons);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);
        document.addEventListener('mozfullscreenchange', updateFullscreenIcons);
        document.addEventListener('MSFullscreenChange', updateFullscreenIcons);

        function showLoader(msg) {
          errorScreen.classList.add('hidden');
          loaderScreen.classList.remove('hidden');
          wm.classList.remove('visible'); // Keep watermark hidden while loading
          if(msg) statusText.textContent = msg;
        }

        function triggerError(msg) {
          clearTimeout(hardTimeout);
          loaderScreen.classList.add('hidden');
          errorScreen.classList.remove('hidden');
          wm.classList.remove('visible'); // Hide watermark on error
          if (msg) document.getElementById('error-desc').textContent = msg;
          if (hls) { hls.destroy(); hls = null; }
          if (plyr) { plyr.destroy(); plyr = null; }
        }

        function mountWm(){
          const p = document.querySelector('.plyr');
          if (p && !p.contains(wm)) { p.style.position = 'relative'; p.appendChild(wm); }
        }

        function onVideoReadyToPlay() {
          clearTimeout(hardTimeout);
          loaderScreen.classList.add('hidden');
          errorScreen.classList.add('hidden');
          mountWm();
          wm.classList.add('visible'); // Show watermark ONLY after stream has loaded
        }

        if (!DIRECT_SRC) {
          triggerError('No stream URL provided. Add ?url=<m3u8-link> to the page URL.');
          return;
        }

        hardTimeout = setTimeout(() => {
          triggerError('Connection timed out. Check if the stream URL is valid, CORS is allowed, and the .m3u8 is reachable.');
        }, 15000);

        function lockLandscape(){
          try {
            const scr = screen.orientation || screen.msOrientation;
            if (scr && scr.lock) scr.lock('landscape').catch(()=>{});
          } catch(e) {}
        }
        function unlockOrientation(){
          try {
            const scr = screen.orientation || screen.msOrientation;
            if (scr && scr.unlock) scr.unlock();
          } catch(e) {}
        }
        document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) lockLandscape(); else unlockOrientation(); });
        video.addEventListener('webkitbeginfullscreen', lockLandscape);
        video.addEventListener('webkitendfullscreen', unlockOrientation);

        video.addEventListener('playing', onVideoReadyToPlay);
        video.addEventListener('canplay', onVideoReadyToPlay);
        video.addEventListener('loadedmetadata', onVideoReadyToPlay);

        function initPlayer(srcUrl) {
          if (!Hls.isSupported() && video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = srcUrl;
            plyr = new Plyr(video, { controls: ['play-large','play','progress','current-time','mute','volume'] });
            
            video.play().catch(()=>{});
            video.addEventListener('error', () => triggerError('Native playback failed. The stream might be offline or unsupported.'));
            return;
          }

          if (!Hls.isSupported()) {
            triggerError('Your browser does not support HLS playback.');
            return;
          }

          hls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            liveSyncDuration: 8,
            liveMaxLatencyDuration: 15,
            enableWorker: true,
            lowLatencyMode: false,
          });

          hls.loadSource(srcUrl);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
            const qualities = data.levels.map(l => l.height).filter(h => h > 0).sort((a,b)=>b-a);
            const uniqueQualities = [...new Set(qualities)];

            plyr = new Plyr(video, {
              controls: ['play-large','play','progress','current-time','mute','volume', uniqueQualities.length > 1 ? 'settings' : ''].filter(Boolean),
              settings: ['quality'],
              quality: {
                default: uniqueQualities[0] || 'default',
                options: uniqueQualities,
                forced: true,
                onChange: q => {
                  const bestIdx = hls.levels.findIndex(l => l.height === q);
                  if (bestIdx !== -1) hls.currentLevel = bestIdx;
                }
              }
            });

            video.play().catch(()=>{});
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    statusText.textContent = `RECONNECTING... (${retryCount}/${MAX_RETRIES})`;
                    showLoader();
                    hls.startLoad();
                  } else {
                    triggerError('Network Error: Maximum retries reached. The stream is currently offline or unreachable due to CORS.');
                  }
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    hls.recoverMediaError();
                  } else {
                    triggerError('Media Error: Stream decoding failed repeatedly.');
                  }
                  break;
                default:
                  triggerError('Stream Error: An unrecoverable error occurred while attempting to parse the manifest.');
                  break;
              }
            }
          });
        }

        function resetWm() {
          if (!wm.classList.contains('visible')) return;
          wm.style.opacity = '0.5';
          clearTimeout(wmTimer);
          wmTimer = setTimeout(() => { if (!video.paused) wm.style.opacity = '0.2'; }, 3000);
        }
        video.addEventListener('play', resetWm);
        video.addEventListener('pause', () => { if (wm.classList.contains('visible')) wm.style.opacity = '0.5'; });
        document.addEventListener('mousemove', resetWm);
        document.addEventListener('touchstart', resetWm);

        initPlayer(DIRECT_SRC);
      })();
    </script>
  </body>
</html>
