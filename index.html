<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAM 47 - Live Stream Player</title>
  
  <!-- Fonts & External CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

  <!-- HLS.js & Plyr.js Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <style>
    :root {
      --bg-dark: #080a09;
      --brand-blue: #4169E1;
      --brand-blue-glow: rgba(65, 105, 225, 0.45);
      --brand-white: #ffffff;
      --text-muted: #8a99ad;
      --font-brand: 'Bebas Neue', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      font-family: var(--font-body);
      overflow: hidden;
      color: #fff;
    }

    /* ── SCREENS ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: radial-gradient(circle at center, #0e1319 0%, var(--bg-dark) 100%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
      text-align: center;
      padding: 3vh 3vw;
    }
    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── LOADER SCREEN (Compact 16:9 Scaled) ── */
    #loader-screen { 
      z-index: 50; 
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 90%;
      max-height: 90vh;
    }

    /* Scaled Brand Glow Animation for Small Iframe Heights */
    .brand-title {
      font-family: var(--font-brand);
      font-size: clamp(32px, 8vh, 52px);
      letter-spacing: 2px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3), 0 0 22px var(--brand-blue-glow);
      animation: brandGlow 2.5s ease-in-out infinite alternate;
      margin-bottom: clamp(8px, 2.2vh, 16px);
    }
    .brand-title span { 
      color: var(--brand-blue); 
      text-shadow: 0 0 15px var(--brand-blue-glow), 0 0 25px rgba(65, 105, 225, 0.6);
    }

    @keyframes brandGlow {
      0% {
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.25), 0 0 15px var(--brand-blue-glow);
        transform: scale(1);
      }
      100% {
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.5), 0 0 30px rgba(65, 105, 225, 0.75);
        transform: scale(1.02);
      }
    }

    /* Compact Three Dots Loader */
    .loader-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.5vw, 10px);
      margin-bottom: clamp(12px, 2.5vh, 22px);
    }
    .loader-dots span {
      width: clamp(6px, 1.2vh, 8px);
      height: clamp(6px, 1.2vh, 8px);
      border-radius: 50%;
      background-color: var(--brand-blue);
      box-shadow: 0 0 8px var(--brand-blue-glow);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loader-dots span:nth-child(2) { animation-delay: -0.16s; }
    .loader-dots span:nth-child(3) { animation-delay: 0s; }

    @keyframes dotPulse {
      0%, 80%, 100% { 
        transform: scale(0.6); 
        opacity: 0.3;
      }
      40% { 
        transform: scale(1.15); 
        opacity: 1;
        box-shadow: 0 0 12px var(--brand-blue);
      }
    }

    .subtitle {
      font-size: clamp(10px, 1.8vh, 12px);
      font-weight: 700;
      letter-spacing: clamp(3px, 0.8vw, 5px);
      color: #e0e6ed;
      text-transform: uppercase;
      margin-bottom: clamp(14px, 3vh, 26px);
      opacity: 0.85;
    }

    .status-text {
      font-size: clamp(9px, 1.5vh, 10px);
      font-weight: 700;
      letter-spacing: clamp(2px, 0.6vw, 4px);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── ERROR SCREEN ── */
    #error-screen { z-index: 40; }
    .error-icon {
      width: clamp(32px, 6vh, 44px);
      height: clamp(32px, 6vh, 44px);
      margin-bottom: 12px;
      color: #ff4d4d;
    }
    .error-title {
      font-family: var(--font-brand);
      font-size: clamp(22px, 4vh, 28px);
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #ff4d4d;
    }
    .error-desc {
      font-size: clamp(11px, 1.8vh, 12px);
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .retry-btn {
      background: rgba(65, 105, 225, 0.2);
      border: 1px solid var(--brand-blue);
      color: #fff;
      padding: 6px 18px;
      border-radius: 4px;
      font-weight: 700;
      font-size: clamp(10px, 1.5vh, 11px);
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .retry-btn:hover {
      background: var(--brand-blue);
      box-shadow: 0 0 12px var(--brand-blue-glow);
    }

    /* ── PLAYER CONTAINER & OVERLAYS ── */
    #player-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      z-index: 5;
    }
    video { width: 100%; height: 100%; display: block; }
    .plyr { width: 100% !important; height: 100% !important; position: relative; font-weight: 600; }
    .plyr--video, .plyr__video-wrapper { height: 100% !important; }
    .plyr video { height: 100% !important; object-fit: contain; }
    
    /* Watermark Top Left (Join Button) */
    #join-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 102;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 2px 8px;
      border-radius: 3px;
      text-decoration: none;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      transition: all 0.4s ease;
      opacity: 0;
      visibility: hidden;
    }
    #join-btn.visible { opacity: 1; visibility: visible; }
    #join-btn:hover { color: #fff; border-color: #fff; background: rgba(0,0,0,0.7); }

    /* Custom Overlay Fullscreen Button */
    #custom-fs-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 103;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(65, 105, 225, 0.3);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s ease, transform 0.2s;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
    }
    #custom-fs-btn.visible { opacity: 1; visibility: visible; }
    #custom-fs-btn:hover {
      background: rgba(65, 105, 225, 0.2);
      border-color: var(--brand-blue);
      box-shadow: 0 0 6px var(--brand-blue-glow);
      transform: scale(1.05);
    }
    #custom-fs-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Hide Overlays when Controls Hide */
    .plyr--hide-controls #join-btn,
    .plyr--hide-controls #custom-fs-btn {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* Watermark Bottom Center */
    #wm {
      position: absolute;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 102;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      width: max-content;
      max-width: 85%;
    }
    #wm.visible {
      visibility: visible;
      opacity: 0.4;
    }
    .plyr--hide-controls #wm.visible { opacity: 0.2; }
    .wm-rule { width: 20px; height: 1px; background: linear-gradient(90deg, transparent, var(--brand-blue)); flex-shrink: 0; }
    .wm-rule.r { background: linear-gradient(90deg, var(--brand-blue), transparent); flex-shrink: 0; }
    .wm-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; white-space: nowrap; }
    .wm-name { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 8px #000; }
    .wm-name span { color: var(--brand-blue); }
    .wm-url { font-size: 8.5px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.6); text-transform: uppercase; white-space: nowrap; }

    /* In-Player Buffering Indicator */
    #buffering-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 101;
      display: flex;
      gap: 5px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #buffering-indicator.active {
      opacity: 1;
      visibility: visible;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--brand-blue);
      border-radius: 50%;
      animation: dotPulse 1.2s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOADER SCREEN -->
  <div id="loader-screen" class="screen">
    <div class="loader-content">
      <h1 class="brand-title">STREAM<span>47</span></h1>
      
      <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="subtitle">LIVE MATCH CENTER</div>
      <div id="status-text" class="status-text">ESTABLISHING CONNECTION...</div>
    </div>
  </div>

  <!-- ERROR SCREEN -->
  <div id="error-screen" class="screen hidden">
    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <div class="error-title">STREAM UNAVAILABLE</div>
    <div id="error-desc" class="error-desc">Unable to load the requested video stream. Please check your internet connection or stream URL.</div>
    <button class="retry-btn" onclick="retryStream()">RETRY CONNECTION</button>
  </div>

  <!-- PLAYER WRAPPER -->
  <div id="player-wrap">
    <a id="join-btn" href="https://whatsapp.com/channel/0029VbBcvbn9WtC1onDirp09" target="_blank">JOIN US</a>
    
    <!-- In-Player Buffering Indicator -->
    <div id="buffering-indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- CUSTOM FULLSCREEN BUTTON -->
    <button id="custom-fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
      <svg id="fs-icon-enter" viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
      <svg id="fs-icon-exit" class="hidden" viewBox="0 0 24 24">
        <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
      </svg>
    </button>

    <video id="player" playsinline controls></video>
  </div>

  <!-- WATERMARK (Bottom Center) -->
  <div id="wm">
    <div class="wm-rule"></div>
    <div class="wm-inner">
      <div class="wm-name">STREAM<span>47</span></div>
      <div class="wm-url">STREAM47.BLOGSPOT.COM</div>
    </div>
    <div class="wm-rule r"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let hls = null;
      let plyr = null;
      let hardTimeout = null;
      let retryCount = 0;
      let wmTimer = null;
      const MAX_RETRIES = 3;

      const params = new URLSearchParams(window.location.search);
      const DIRECT_SRC = params.get('url') || params.get('stream') || params.get('get') || params.get('src') || '';

      const video = document.getElementById('player');
      const playerWrap = document.getElementById('player-wrap');
      const loaderScreen = document.getElementById('loader-screen');
      const errorScreen = document.getElementById('error-screen');
      const statusText = document.getElementById('status-text');
      const wm = document.getElementById('wm');
      const joinBtn = document.getElementById('join-btn');
      const customFsBtn = document.getElementById('custom-fs-btn');
      const bufferingIndicator = document.getElementById('buffering-indicator');

      // Robust Fullscreen Switch targeting Plyr / Container
      window.toggleFullscreen = function() {
        if (plyr && plyr.fullscreen) {
          plyr.fullscreen.toggle();
        } else {
          if (!document.fullscreenElement) {
            if (playerWrap.requestFullscreen) playerWrap.requestFullscreen();
            else if (playerWrap.webkitRequestFullscreen) playerWrap.webkitRequestFullscreen();
            else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        }
      };

      function updateFsIcons(isFullscreen) {
        const enterIcon = document.getElementById('fs-icon-enter');
        const exitIcon = document.getElementById('fs-icon-exit');
        if (isFullscreen) {
          enterIcon.classList.add('hidden');
          exitIcon.classList.remove('hidden');
        } else {
          enterIcon.classList.remove('hidden');
          exitIcon.classList.add('hidden');
        }
      }

      // Mobile Landscape Orientation Auto-Lock
      function lockLandscape(){
        try {
          const scr = screen.orientation || screen.msOrientation;
          if (scr && scr.lock) scr.lock('landscape').catch(() => {});
        } catch(e) {}
      }

      function unlockOrientation(){
        try {
          const scr = screen.orientation || screen.msOrientation;
          if (scr && scr.unlock) scr.unlock();
        } catch(e) {}
      }

      document.addEventListener('fullscreenchange', () => { 
        const isFs = !!document.fullscreenElement;
        updateFsIcons(isFs);
        if (isFs) lockLandscape(); else unlockOrientation(); 
      });

      video.addEventListener('webkitbeginfullscreen', () => lockLandscape());
      video.addEventListener('webkitendfullscreen', () => unlockOrientation());

      function triggerError(msg) {
        clearTimeout(hardTimeout);
        loaderScreen.classList.add('hidden');
        errorScreen.classList.remove('hidden');
        bufferingIndicator.classList.remove('active');
        if (msg) document.getElementById('error-desc').textContent = msg;
        if (hls) { hls.destroy(); hls = null; }
        if (plyr) { plyr.destroy(); plyr = null; }
      }

      function mountWm(){
        const p = document.querySelector('.plyr');
        if (p && !p.contains(wm)) { 
          p.style.position = 'relative'; 
          p.appendChild(wm); 
        }
      }

      function onVideoReadyToPlay() {
        clearTimeout(hardTimeout);
        loaderScreen.classList.add('hidden');
        errorScreen.classList.add('hidden');
        bufferingIndicator.classList.remove('active');
        mountWm();
        
        wm.classList.add('visible');
        joinBtn.classList.add('visible');
        customFsBtn.classList.add('visible');
      }

      if (!DIRECT_SRC) {
        triggerError('No stream URL provided. Add ?url=<m3u8-link> to the page URL.');
        return;
      }

      video.addEventListener('waiting', () => {
        if (loaderScreen.classList.contains('hidden')) {
          bufferingIndicator.classList.add('active');
        }
      });

      video.addEventListener('playing', onVideoReadyToPlay);
      video.addEventListener('canplay', onVideoReadyToPlay);
      video.addEventListener('loadedmetadata', onVideoReadyToPlay);

      // Core Player & Quality Configuration
      function initPlayer(sourceUrl) {
        loaderScreen.classList.remove('hidden');
        errorScreen.classList.add('hidden');
        statusText.textContent = "ESTABLISHING CONNECTION...";

        clearTimeout(hardTimeout);
        hardTimeout = setTimeout(() => {
          if (!video.currentTime && loaderScreen.classList.contains('hidden') === false) {
            triggerError("Connection timed out. Stream took too long to respond.");
          }
        }, 18000);

        if (Hls.isSupported()) {
          if (hls) hls.destroy();

          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90
          });

          hls.loadSource(sourceUrl);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
            // Extract available qualities for gear menu
            const availableQualities = hls.levels.map((l) => l.height).filter(Boolean);
            availableQualities.unshift(0); // 0 = Auto

            setupPlyr(availableQualities);
            video.play().catch(() => {});
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    statusText.textContent = `RECONNECTING (${retryCount}/${MAX_RETRIES})...`;
                    hls.startLoad();
                  } else {
                    triggerError("Network error: Unable to fetch live stream segments.");
                  }
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  hls.recoverMediaError();
                  break;
                default:
                  triggerError("Fatal playback error occurred.");
                  break;
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = sourceUrl;
          setupPlyr([]);
          video.play().catch(() => {});
        } else {
          triggerError("Your browser does not support HLS stream playback.");
        }
      }

      function setupPlyr(qualities = []) {
        if (plyr) return;

        const defaultOptions = {
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
          settings: ['quality', 'speed'],
          quality: {
            default: 0,
            options: qualities.length ? qualities : [0],
            forced: true,
            onChange: (newQuality) => {
              if (!hls) return;
              if (newQuality === 0) {
                hls.currentLevel = -1; // Auto level selection
              } else {
                hls.levels.forEach((level, levelIndex) => {
                  if (level.height === newQuality) {
                    hls.currentLevel = levelIndex;
                  }
                });
              }
            }
          },
          i18n: {
            qualityLabel: {
              0: 'Auto'
            }
          },
          keyboard: { focused: true, global: true },
          tooltips: { controls: true, seek: true }
        };

        plyr = new Plyr(video, defaultOptions);

        plyr.on('fullscreenchange', (event) => {
          updateFsIcons(event.detail.plyr.fullscreen.active);
        });
      }

      function resetWm() {
        if (!wm.classList.contains('visible')) return;
        wm.style.opacity = '0.4';
        clearTimeout(wmTimer);
        wmTimer = setTimeout(() => { 
          if (!video.paused && wm.classList.contains('visible')) {
            wm.style.opacity = '0.2'; 
          }
        }, 3000);
      }

      video.addEventListener('play', resetWm);
      video.addEventListener('pause', () => {
        if (wm.classList.contains('visible')) wm.style.opacity = '0.4';
      });
      document.addEventListener('mousemove', resetWm);
      document.addEventListener('touchstart', resetWm);

      window.retryStream = function() {
        retryCount = 0;
        initPlayer(DIRECT_SRC);
      };

      initPlayer(DIRECT_SRC);
    });
  </script>
</body>
</html>
