<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream Player</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Plyr Video Player CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    :root {
      --brand-blue: #4169e1;
      --brand-blue-glow: rgba(65, 105, 225, 0.65);
      --bg-dark: #050806;
      --plyr-color-main: #4169e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: radial-gradient(circle at center, #0f1712 0%, var(--bg-dark) 100%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
      padding: 1rem;
    }
    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── LOADER SCREEN ── */
    #loader-screen { 
      z-index: 50; 
      text-align: center;
    }
    
    /* Remove radar graphic via CSS */
    .radar-container {
      display: none !important;
    }

    /* Centered Glowing Brand Title */
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: 4px;
      line-height: 1;
      text-align: center;
      margin-bottom: 12px;
      color: #ffffff;
      animation: titleGlow 2s ease-in-out infinite alternate;
    }
    .brand-title span { 
      color: var(--brand-blue); 
    }

    @keyframes titleGlow {
      0% {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.4),
                     0 0 20px var(--brand-blue-glow),
                     0 0 30px rgba(65, 105, 225, 0.3);
      }
      100% {
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.8),
                     0 0 35px var(--brand-blue),
                     0 0 50px var(--brand-blue-glow);
      }
    }

    /* Three Loading Dots (...) */
    .dots-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .dots-container .dot {
      width: 8px;
      height: 8px;
      background-color: var(--brand-blue);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--brand-blue-glow);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .dots-container .dot:nth-child(1) { animation-delay: -0.32s; }
    .dots-container .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dotPulse {
      0%, 80%, 100% { 
        transform: scale(0.6); 
        opacity: 0.3; 
      }
      40% { 
        transform: scale(1.2); 
        opacity: 1; 
        box-shadow: 0 0 12px var(--brand-blue);
      }
    }

    .subtitle {
      font-size: clamp(10px, 2vw, 13px);
      font-weight: 700;
      letter-spacing: 6px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    #status-text {
      font-size: clamp(9px, 1.8vw, 11px);
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }

    /* ── ERROR SCREEN ── */
    #error-screen { z-index: 60; text-align: center; }
    .error-icon {
      width: 50px;
      height: 50px;
      margin-bottom: 16px;
      color: #ff4d4d;
    }
    .error-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 2px;
      color: #ff4d4d;
      margin-bottom: 8px;
    }
    .error-desc {
      font-size: clamp(11px, 2vw, 13px);
      color: rgba(255, 255, 255, 0.6);
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .retry-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .retry-btn:hover {
      background: var(--brand-blue);
      border-color: var(--brand-blue);
      box-shadow: 0 0 15px var(--brand-blue-glow);
    }

    /* ── PLAYER & WATERMARKS ── */
    #player-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      z-index: 5;
    }
    video { width: 100%; height: 100%; display: block; }
    .plyr { width: 100% !important; height: 100% !important; position: relative; font-weight: 600; }
    .plyr--video, .plyr__video-wrapper { height: 100% !important; }
    .plyr video { height: 100% !important; object-fit: contain; }
    
    /* Watermark Top Left (Join) */
    #join-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 102;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 3px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      transition: all 0.4s ease;
      opacity: 0;
      visibility: hidden;
    }
    #join-btn.visible { opacity: 1; visibility: visible; }
    #join-btn:hover { color: #fff; border-color: #fff; background: rgba(0,0,0,0.7); }

    /* Custom Overlay Fullscreen Button */
    #custom-fs-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 103;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(65, 105, 225, 0.3);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s ease, transform 0.2s;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
    }
    #custom-fs-btn.visible { opacity: 1; visibility: visible; }
    #custom-fs-btn:hover {
      background: rgba(65, 105, 225, 0.2);
      border-color: var(--brand-blue);
      box-shadow: 0 0 8px var(--brand-blue-glow);
      transform: scale(1.05);
    }
    #custom-fs-btn svg { width: 14px; height: 14px; fill: currentColor; }
    
    .plyr--fullscreen-active #custom-fs-btn { display: none; }
    .plyr--hide-controls #custom-fs-btn {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* Watermark Bottom Center */
    #wm {
      position: absolute;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 102;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      width: max-content;
      max-width: 90%;
    }
    #wm.visible {
      visibility: visible;
      opacity: 0.4;
    }
    .plyr--hide-controls #wm.visible { opacity: 0.2; }
    .wm-rule { width: 30px; height: 1px; background: linear-gradient(90deg, transparent, var(--brand-blue)); flex-shrink: 0; }
    .wm-rule.r { background: linear-gradient(90deg, var(--brand-blue), transparent); flex-shrink: 0; }
    .wm-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; white-space: nowrap; }
    .wm-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 4px; color: #fff; text-shadow: 0 2px 10px #000; }
    .wm-name span { color: var(--brand-blue); }
    .wm-url { font-size: 10px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.6); text-transform: uppercase; white-space: nowrap; }

    #buffering-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 101;
      display: flex;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #buffering-indicator.active {
      opacity: 1;
      visibility: visible;
    }

    /* Hidden helper utility class */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOADER SCREEN -->
  <div id="loader-screen" class="screen">
    <div class="brand-title">STREAM<span>47</span></div>
    
    <!-- Preserved Dots Loading Animation -->
    <div class="dots-container">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="subtitle">LIVE MATCH CENTER</div>
    <div id="status-text">ESTABLISHING CONNECTION...</div>
  </div>

  <!-- ERROR SCREEN -->
  <div id="error-screen" class="screen hidden">
    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <div class="error-title">STREAM UNAVAILABLE</div>
    <div class="error-desc" id="error-desc">Unable to load the requested video stream. Please check your link or try again.</div>
    <button class="retry-btn" onclick="location.reload()">RETRY CONNECTION</button>
  </div>

  <!-- PLAYER WRAPPER -->
  <div id="player-wrap">
    <a id="join-btn" href="https://whatsapp.com/channel/0029VbBcvbn9WtC1onDirp09" target="_blank">JOIN US</a>
    
    <!-- In-Player Buffering Indicator -->
    <div id="buffering-indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- CUSTOM FULLSCREEN BUTTON (Overlay top-right corner) -->
    <button id="custom-fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
      <svg viewBox="0 0 18 18">
        <path d="M4.5 11H3v4h4v-1.5H4.5V11zM3 7h1.5V4.5H7V3H3v4zm10.5 6.5H11V15h4v-4h-1.5v2.5zM11 3v1.5h2.5V7H15V3h-4z"/>
      </svg>
    </button>

    <!-- WATERMARK BOTTOM CENTER -->
    <div id="wm">
      <div class="wm-rule"></div>
      <div class="wm-inner">
        <div class="wm-name">STREAM<span>47</span></div>
        <div class="wm-url">STREAM47.BLOGSPOT.COM</div>
      </div>
      <div class="wm-rule r"></div>
    </div>

    <video id="player" playsinline controls></video>
  </div>

  <!-- External Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <script>
    let plyr = null;
    let hls = null;
    let hardTimeout = null;
    let retryCount = 0;
    let wmTimer = null;
    const MAX_RETRIES = 3;

    const params = new URLSearchParams(window.location.search);
    const DIRECT_SRC = params.get('url') || params.get('stream') || params.get('get') || params.get('src') || '';

    const video = document.getElementById('player');
    const loaderScreen = document.getElementById('loader-screen');
    const errorScreen = document.getElementById('error-screen');
    const statusText = document.getElementById('status-text');
    const wm = document.getElementById('wm');
    const joinBtn = document.getElementById('join-btn');
    const customFsBtn = document.getElementById('custom-fs-btn');
    const bufferingIndicator = document.getElementById('buffering-indicator');

    // Robust Multi-Fallback Fullscreen Handler (Supports iframe embedding)
    window.toggleFullscreen = function() {
      const wrap = document.getElementById('player-wrap') || document.documentElement;

      if (plyr && plyr.fullscreen && typeof plyr.fullscreen.toggle === 'function') {
        try {
          plyr.fullscreen.toggle();
          return;
        } catch (e) {
          console.warn('Plyr fullscreen API failed, falling back to browser Native API:', e);
        }
      }

      // Check active fullscreen element
      const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

      if (!isFS) {
        if (wrap.requestFullscreen) {
          wrap.requestFullscreen().catch(() => requestParentFullscreen());
        } else if (wrap.webkitRequestFullscreen) {
          wrap.webkitRequestFullscreen();
        } else if (wrap.mozRequestFullScreen) {
          wrap.mozRequestFullScreen();
        } else if (wrap.msRequestFullscreen) {
          wrap.msRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        } else {
          requestParentFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    };

    // PostMessage fallback trigger for restricted cross-origin iframes
    function requestParentFullscreen() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'REQUEST_FULLSCREEN' }, '*');
        }
      } catch (e) {
        console.warn('Cross-origin postMessage blocked:', e);
      }
    }

    // Error triggers and dismantles components cleanly
    function triggerError(msg) {
      clearTimeout(hardTimeout);
      loaderScreen.classList.add('hidden');
      errorScreen.classList.remove('hidden');
      bufferingIndicator.classList.remove('active');
      if (msg) document.getElementById('error-desc').textContent = msg;
      if (hls) { hls.destroy(); hls = null; }
      if (plyr) { plyr.destroy(); plyr = null; }
    }

    function mountWm(){
      const p = document.querySelector('.plyr');
      if (p && !p.contains(wm)) { p.style.position = 'relative'; p.appendChild(wm); }
    }

    // Hides Loader Screen and configures Watermark alignment
    function onVideoReadyToPlay() {
      clearTimeout(hardTimeout);
      loaderScreen.classList.add('hidden');
      errorScreen.classList.add('hidden');
      bufferingIndicator.classList.remove('active');
      mountWm();
      
      // Reveal overlays ONLY when video is actually playing/ready
      wm.classList.add('visible');
      joinBtn.classList.add('visible');
      customFsBtn.classList.add('visible');
    }

    if (!DIRECT_SRC) {
      triggerError('No stream URL provided. Add ?url=<m3u8-link> to the page URL.');
    }

    // Auto-lock Landscape in mobile when fullscreen toggled
    function lockLandscape(){
      try {
        const scr = screen.orientation || screen.msOrientation;
        if (scr && scr.lock) scr.lock('landscape').catch(()=>{});
      } catch(e) {}
    }
    function unlockOrientation(){
      try {
        const scr = screen.orientation || screen.msOrientation;
        if (scr && scr.unlock) scr.unlock();
      } catch(e) {}
    }
    document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) lockLandscape(); else unlockOrientation(); });
    video.addEventListener('webkitbeginfullscreen', lockLandscape);
    video.addEventListener('webkitendfullscreen', unlockOrientation);

    // Handle Player Buffering State for embedded views
    video.addEventListener('waiting', () => {
      if (loaderScreen.classList.contains('hidden')) {
        bufferingIndicator.classList.add('active');
      }
    });

    // Hide Loader as soon as video plays OR is ready to be played
    video.addEventListener('playing', onVideoReadyToPlay);
    video.addEventListener('canplay', onVideoReadyToPlay);
    video.addEventListener('loadedmetadata', onVideoReadyToPlay);

    // Core Player Setup
    function initPlayer(src) {
      statusText.textContent = retryCount > 0 ? `RECONNECTING (ATTEMPT ${retryCount}/${MAX_RETRIES})...` : "ESTABLISHING CONNECTION...";

      hardTimeout = setTimeout(() => {
        if (retryCount < MAX_RETRIES) {
          retryCount++;
          initPlayer(src);
        } else {
          triggerError("Connection timed out. The stream may be offline or restricted.");
        }
      }, 15000);

      if (Hls.isSupported()) {
        if (hls) hls.destroy();

        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90
        });

        hls.loadSource(src);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          const availableQualities = data.levels.map(l => l.height);
          availableQualities.unshift(0);

          setupPlyr(availableQualities, (newQuality) => {
            if (newQuality === 0) {
              hls.currentLevel = -1;
            } else {
              hls.levels.forEach((level, levelIndex) => {
                if (level.height === newQuality) {
                  hls.currentLevel = levelIndex;
                }
              });
            }
          });

          video.play().catch(() => {
            console.log("Autoplay blocked - awaiting user interaction.");
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                if (retryCount < MAX_RETRIES) {
                  retryCount++;
                  hls.startLoad();
                } else {
                  triggerError("Network error: Unable to connect to stream server.");
                }
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                triggerError("Fatal playback error encountered.");
                break;
            }
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        setupPlyr([]);
        video.play().catch(() => {
          console.log("Autoplay blocked - awaiting user interaction.");
        });
      } else {
        triggerError("Your browser does not support HLS stream playback.");
      }
    }

    function setupPlyr(qualities, qualityCallback) {
      if (plyr) return;

      const plyrOptions = {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
        settings: ['quality', 'speed'],
        quality: {
          default: 0,
          options: qualities,
          forced: true,
          onChange: qualityCallback,
        },
        i18n: {
          qualityLabel: {
            0: 'Auto',
          },
        },
        keyboard: { focused: true, global: true },
        tooltips: { controls: true, seek: true }
      };

      plyr = new Plyr(video, plyrOptions);

      plyr.on('ready', () => {
        mountWm();
      });

      plyr.on('fullscreenchange', (event) => {
        if (event.detail.plyr.isFullscreen) {
          lockLandscape();
        } else {
          unlockOrientation();
        }
      });
    }

    // Watermark fading logic
    function resetWm() {
      if (!wm.classList.contains('visible')) return;
      wm.style.opacity = '0.4';
      clearTimeout(wmTimer);
      wmTimer = setTimeout(() => { if (!video.paused && wm.classList.contains('visible')) wm.style.opacity = '0.2'; }, 3000);
    }
    video.addEventListener('play', resetWm);
    video.addEventListener('pause', () => {
      if (wm.classList.contains('visible')) wm.style.opacity = '0.4';
    });
    document.addEventListener('mousemove', resetWm);
    document.addEventListener('touchstart', resetWm);

    // Start Player Initialization
    initPlayer(DIRECT_SRC);
  </script>
</body>
</html>
