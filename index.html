<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STREAM 47 - Live Match Center</title>

  <!-- Google Fonts: Bebas Neue & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Plyr Video Player CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <!-- HLS.js for HLS Stream Support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Plyr.js for Video UI -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <style>
    :root {
      --brand-blue: #4169E1;
      --brand-blue-glow: rgba(65, 105, 225, 0.6);
      --brand-blue-soft: rgba(65, 105, 225, 0.3);
      --bg-dark: #080a0c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* ── CONTAINER WRAPPER ── */
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── SCREENS (Loader & Error) ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: radial-gradient(circle at center, #0f141c 0%, var(--bg-dark) 100%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
      text-align: center;
      padding: 16px;
    }

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── BRAND TITLE & GLOW ANIMATION ── */
    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 8vw, 64px);
      letter-spacing: 5px;
      line-height: 1;
      color: #ffffff;
      animation: brandGlow 2s ease-in-out infinite alternate;
      text-align: center;
    }

    .brand-title span {
      color: var(--brand-blue);
    }

    @keyframes brandGlow {
      0% {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2), 0 0 20px var(--brand-blue-soft), 0 0 30px var(--brand-blue-soft);
      }
      100% {
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px var(--brand-blue-glow), 0 0 50px var(--brand-blue-glow);
      }
    }

    /* ── THREE-DOT CONNECTING ANIMATION ── */
    .loading-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 14px 0 22px 0;
    }

    .loading-dots .dot {
      width: clamp(6px, 1.8vw, 10px);
      height: clamp(6px, 1.8vw, 10px);
      border-radius: 50%;
      background-color: var(--brand-blue);
      box-shadow: 0 0 8px var(--brand-blue-glow);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }

    .loading-dots .dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots .dot:nth-child(2) { animation-delay: -0.16s; }
    .loading-dots .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.3;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    /* ── SUBTITLE & CONNECTION STATUS ── */
    .subtitle {
      font-size: clamp(10px, 2.2vw, 14px);
      font-weight: 700;
      letter-spacing: 6px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .status-text {
      font-size: clamp(9px, 1.8vw, 11px);
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }

    /* ── ERROR SCREEN ── */
    .error-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      color: #ff4d4d;
    }

    .error-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #ff4d4d;
      margin-bottom: 8px;
    }

    .error-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 80%;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .retry-btn {
      background: var(--brand-blue);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .retry-btn:hover {
      background: #3154b3;
      box-shadow: 0 0 12px var(--brand-blue-glow);
    }

    /* ── PLAYER & OVERLAYS ── */
    #player-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      z-index: 5;
    }

    video { width: 100%; height: 100%; display: block; }
    .plyr { width: 100% !important; height: 100% !important; position: relative; font-weight: 600; }
    .plyr--video, .plyr__video-wrapper { height: 100% !important; }
    .plyr video { height: 100% !important; object-fit: contain; }

    /* Watermark Top Left (JOIN US) */
    #join-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 102;
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      transition: all 0.4s ease;
      opacity: 0;
      visibility: hidden;
    }
    #join-btn.visible { opacity: 1; visibility: visible; }
    #join-btn:hover { color: #fff; border-color: #fff; background: rgba(0,0,0,0.8); }

    /* Custom Top-Right Fullscreen Toggle (Iframe & Touch Robust) */
    #custom-fs-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 103;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(65, 105, 225, 0.4);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s ease, transform 0.2s;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
    }
    #custom-fs-btn.visible { opacity: 1; visibility: visible; }
    #custom-fs-btn:hover {
      background: rgba(65, 105, 225, 0.3);
      border-color: var(--brand-blue);
      box-shadow: 0 0 10px var(--brand-blue-glow);
      transform: scale(1.05);
    }
    #custom-fs-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .plyr--hide-controls #custom-fs-btn {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* Watermark Bottom Center */
    #wm {
      position: absolute;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 102;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      width: max-content;
      max-width: 90%;
    }
    #wm.visible {
      visibility: visible;
      opacity: 0.4;
    }
    .plyr--hide-controls #wm.visible { opacity: 0.2; }
    .wm-rule { width: 24px; height: 1px; background: linear-gradient(90deg, transparent, var(--brand-blue)); flex-shrink: 0; }
    .wm-rule.r { background: linear-gradient(90deg, var(--brand-blue), transparent); flex-shrink: 0; }
    .wm-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; white-space: nowrap; }
    .wm-name { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 10px #000; }
    .wm-name span { color: var(--brand-blue); }
    .wm-url { font-size: 9px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.6); text-transform: uppercase; white-space: nowrap; }

    /* In-Player Buffering Spinner Overlay */
    #buffering-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 101;
      display: flex;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #buffering-indicator.active {
      opacity: 1;
      visibility: visible;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app-container">
    
    <!-- LOADER SCREEN -->
    <div id="loader-screen" class="screen">
      <div class="brand-container">
        <div class="brand-title">STREAM <span>47</span></div>
      </div>
      
      <!-- Three-Dot Loading Indicator -->
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="subtitle">LIVE MATCH CENTER</div>
      <div id="status-text" class="status-text">ESTABLISHING CONNECTION...</div>
    </div>

    <!-- ERROR SCREEN -->
    <div id="error-screen" class="screen hidden">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div class="error-title">STREAM UN-AVAILABLE</div>
      <div id="error-desc" class="error-desc">Unable to load the requested video feed. Please check the URL parameters or try reloading.</div>
      <button class="retry-btn" onclick="location.reload()">RETRY CONNECTION</button>
    </div>

    <!-- PLAYER WRAPPER -->
    <div id="player-wrap">
      <!-- Watermark Top Left -->
      <a id="join-btn" href="https://whatsapp.com/channel/0029VbBcvbn9WtC1onDirp09" target="_blank" rel="noopener">JOIN US</a>
      
      <!-- In-Player Buffering Indicator -->
      <div id="buffering-indicator">
        <div class="loading-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- Custom Overlay Fullscreen Button -->
      <button id="custom-fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>

      <!-- Video Element -->
      <video id="player" playsinline controls preload="auto"></video>

      <!-- Watermark Bottom Center -->
      <div id="wm">
        <div class="wm-rule"></div>
        <div class="wm-inner">
          <div class="wm-name">STREAM <span>47</span></div>
          <div class="wm-url">STREAM47.BLOGSPOT.COM</div>
        </div>
        <div class="wm-rule r"></div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      let plyr = null;
      let hls = null;
      let hardTimeout = null;
      let wmTimer = null;

      const params = new URLSearchParams(window.location.search);
      const DIRECT_SRC = params.get('url') || params.get('stream') || params.get('get') || params.get('src') || '';

      const video = document.getElementById('player');
      const loaderScreen = document.getElementById('loader-screen');
      const errorScreen = document.getElementById('error-screen');
      const wm = document.getElementById('wm');
      const joinBtn = document.getElementById('join-btn');
      const customFsBtn = document.getElementById('custom-fs-btn');
      const bufferingIndicator = document.getElementById('buffering-indicator');
      const container = document.getElementById('app-container');

      /* ── ROBUST FULLSCREEN TOGGLE (Works in iframe & iOS) ── */
      window.toggleFullscreen = function () {
        if (plyr && plyr.fullscreen) {
          try {
            plyr.fullscreen.toggle();
            return;
          } catch (e) {}
        }

        const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        
        if (!isFs) {
          const req = container.requestFullscreen || container.webkitRequestFullscreen || container.mozRequestFullScreen || container.msRequestFullscreen;
          if (req) {
            req.call(container).catch(() => {
              if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            });
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }

          // Fallback postMessage notification to host parent window if embedded
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'REQUEST_FULLSCREEN' }, '*');
            }
          } catch (err) {}
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
          if (exit) exit.call(document);
        }
      };

      /* ── ERROR HANDLING ── */
      function triggerError(msg) {
        clearTimeout(hardTimeout);
        loaderScreen.classList.add('hidden');
        errorScreen.classList.remove('hidden');
        bufferingIndicator.classList.remove('active');
        if (msg) document.getElementById('error-desc').textContent = msg;
        if (hls) { hls.destroy(); hls = null; }
        if (plyr) { plyr.destroy(); plyr = null; }
      }

      function mountWm() {
        const p = document.querySelector('.plyr');
        if (p && !p.contains(wm)) {
          p.style.position = 'relative';
          p.appendChild(wm);
        }
      }

      /* ── VIDEO READY CALLBACK ── */
      function onVideoReadyToPlay() {
        clearTimeout(hardTimeout);
        loaderScreen.classList.add('hidden');
        errorScreen.classList.add('hidden');
        bufferingIndicator.classList.remove('active');
        mountWm();

        wm.classList.add('visible');
        joinBtn.classList.add('visible');
        customFsBtn.classList.add('visible');
      }

      if (!DIRECT_SRC) {
        triggerError('No stream URL provided. Please pass a valid stream link via ?url=<m3u8-url>');
        return;
      }

      /* ── ORIENTATION & BUFFERING LISTENERS ── */
      video.addEventListener('waiting', () => {
        if (loaderScreen.classList.contains('hidden')) {
          bufferingIndicator.classList.add('active');
        }
      });

      video.addEventListener('playing', onVideoReadyToPlay);
      video.addEventListener('canplay', onVideoReadyToPlay);
      video.addEventListener('loadedmetadata', onVideoReadyToPlay);

      /* ── INITIALIZE HLS & PLYR ── */
      function initPlayer(src) {
        hardTimeout = setTimeout(() => {
          if (!video.currentTime) {
            triggerError('Stream connection timed out. Please verify your stream URL or server availability.');
          }
        }, 20000);

        if (Hls.isSupported()) {
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90
          });

          hls.loadSource(src);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            // Populate quality settings menu (Gear icon)
            const availableQualities = hls.levels.map((l) => l.height);
            availableQualities.unshift(0); // Auto quality

            plyr = new Plyr(video, {
              controls: [
                'play-large', 'play', 'progress', 'current-time',
                'mute', 'volume', 'settings', 'pip', 'fullscreen'
              ],
              settings: ['quality', 'speed'],
              quality: {
                default: 0,
                options: availableQualities,
                forced: true,
                onChange: (e) => updateQuality(e)
              },
              tooltips: { controls: true, seek: true }
            });

            video.play().catch(() => {});
          });

          hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  hls.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  hls.recoverMediaError();
                  break;
                default:
                  triggerError('Fatal playback error encountered: ' + data.details);
                  break;
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Safari native HLS fallback
          video.src = src;
          plyr = new Plyr(video, {
            controls: [
              'play-large', 'play', 'progress', 'current-time',
              'mute', 'volume', 'settings', 'pip', 'fullscreen'
            ]
          });
          video.play().catch(() => {});
        } else {
          triggerError('HLS streaming is not supported on this browser.');
        }
      }

      function updateQuality(newQuality) {
        if (!hls) return;
        if (newQuality === 0) {
          hls.currentLevel = -1; // Auto level
        } else {
          hls.levels.forEach((level, levelIndex) => {
            if (level.height === newQuality) {
              hls.currentLevel = levelIndex;
            }
          });
        }
      }

      /* ── WATERMARK FADE LOGIC ── */
      function resetWm() {
        if (!wm.classList.contains('visible')) return;
        wm.style.opacity = '0.4';
        clearTimeout(wmTimer);
        wmTimer = setTimeout(() => {
          if (!video.paused && wm.classList.contains('visible')) {
            wm.style.opacity = '0.2';
          }
        }, 3000);
      }

      video.addEventListener('play', resetWm);
      video.addEventListener('pause', () => {
        if (wm.classList.contains('visible')) wm.style.opacity = '0.4';
      });
      document.addEventListener('mousemove', resetWm);
      document.addEventListener('touchstart', resetWm);

      // Start application
      initPlayer(DIRECT_SRC);
    })();
  </script>
</body>
</html>
